<!DOCTYPE html>
 <html lang="en">
    <head> 
        <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <link rel="shortcut icon" href="{{ url_for('static', filename='logo.png') }}">
        <title>Login - Hobby Recommender</title> 
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"> 
        <style> 
        :root { 
            --primary-color: #4361ee; 
            --primary-hover: #3a56d4; 
            --secondary-color: #3f37c9; 
            --text-color: #2b2d42; 
            --light-text: #8d99ae; 
            --bg-color: #1469bf; 
            --card-bg: #ffffff; 
            --border-radius: 12px; 
            --box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08); 
            --transition: all 0.3s ease; }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }

        h1 {
            color: var(--primary-color);
            font-weight: 600;
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .subtitle {
            color: var(--light-text);
            margin-bottom: 30px;
            font-size: 1rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        button {
            width: 100%;
            padding: 12px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: var(--transition);
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .secondary-btn {
            background-color: #6c757d;
            margin-top: 15px;
        }

        .secondary-btn:hover {
            background-color: #5a6268;
        }

        .text-center {
            text-align: center;
        }

        .mt-3 {
            margin-top: 15px;
        }

        a {
            color: var(--primary-color);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 30px auto;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
    </head> <body> <div class="container"> <h1>Welcome Back</h1> <p class="subtitle">Login to access your hobby recommendations</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            
            <button type="submit">Login</button>
            <button type="button" class="secondary-btn" onclick="window.location.href='/signup'">Create New Account</button>
        </form>
        
        <p class="text-center mt-3">
            <a href="/">← Back to Home</a>        
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Here you would typically send this to your backend
            console.log('Login attempt with:', { email, password });
            
            // For demo purposes, just show an alert and redirect
            // alert('Login successful! Redirecting to main page...');
            window.location.href = '/main';
        });
    </script>
