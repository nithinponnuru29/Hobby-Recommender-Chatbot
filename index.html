<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ url_for('static', filename='logo.png') }}">
    <title>Hobby Recommender with Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-hover: #3a56d4;
            --secondary-color: #3f37c9;
            --text-color: #2b2d42;
            --light-text: #8d99ae;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-radius: 12px;
            --box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .auth-buttons {
            display: flex;
            gap: 10px;
        }

        h1 {
    color: var(--primary-color);
    font-weight: 600;
    font-size: 2.2rem;
    margin: 0;
    text-align: center; 
    width: 100%; 
}

        .subtitle {
            color: var(--light-text);
            margin-bottom: 30px;
            font-size: 1rem;
            text-align: center;
        }

        .chat-container {
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 80%;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        button {
            padding: 12px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: var(--transition);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .chat-message {
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        .user-message {
            background: var(--primary-color);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .bot-message {
            background: #e9ecef;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 30px 0;
        }

        .spinner {
            border: 4px solid rgba(67, 97, 238, 0.1);
            border-radius: 50%;
            border-top: 4px solid var(--primary-color);
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        .loading-text {
            color: var(--light-text);
            font-size: 0.9rem;
        }

        .clear-btn {
            background-color: #ff4d4f;
            padding: 14px 10px;
            margin-right: 10px;
        }

        .clear-btn:hover {
            background-color: #ff7875;
        }

        .auth-btn {
            background-color: #4CAF50;
        }

        .auth-btn:hover {
            background-color: #45a049;
        }

        .signup-btn {
            background-color: #2196F3;
        }

        .signup-btn:hover {
            background-color: #0b7dda;
        }

        .auth-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 20px auto;
            }
            
            .input-section {
                flex-direction: column;
                max-width: 100%;
            }
            
            button {
                width: 100%;
            }
            
            h1 {
                font-size: 1.8rem;
            }

            .chat-controls {
                flex-direction: column;
                gap: 10px;
            }

            .auth-buttons {
                flex-direction: column;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-buttons">
            <button class="auth-btn" onclick="login()">Login</button>
            <button class="signup-btn" onclick="signup()">Sign Up</button>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>Hobby Recommender</h1>
        </div>
        
        <p class="subtitle">Enter your interests and get personalized hobby recommendations!</p>
        
        <div class="chat-container" id="chatContainer">
            <!-- Chat messages will appear here -->
            <div class="bot-message chat-message">
                Hello! I can suggest hobbies based on your interests. What are you interested in?
            </div>
        </div>
        
        <div class="chat-controls">
            <button class="clear-btn" onclick="clearChat()">Start New Conversation</button>
            <div class="input-section">
                <input type="text" id="interestInput" placeholder="e.g. music, painting, hiking, technology..." autofocus>
                <button onclick="getRecommendations()">Send</button>
            </div>
        </div>
        
        <div class="loading" id="loadingIndicator">
            <div class="spinner"></div>
            <p class="loading-text">Generating recommendations...</p>
        </div>
    </div>

    <script>
        function addMessageToChat(role, content) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `${role}-message chat-message`;
            messageDiv.textContent = content;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function getRecommendations() {
            const interest = document.getElementById('interestInput').value.trim();
            const loadingIndicator = document.getElementById('loadingIndicator');
            
            if (!interest) {
                addMessageToChat('bot', 'Please enter an interest to get recommendations.');
                return;
            }
            
            // Add user message to UI immediately
            addMessageToChat('user', interest);
            document.getElementById('interestInput').value = '';
            
            loadingIndicator.style.display = 'block';
            
            try {
                const response = await fetch('/recommend', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ interest: interest })
                });

                // Check if response is JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    throw new Error(`Server returned unexpected response: ${text.substring(0, 100)}`);
                }

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || `Request failed with status ${response.status}`);
                }
                
                if (data.recommendations) {
                    addMessageToChat('bot', data.recommendations);
                } else {
                    throw new Error('No recommendations found in response');
                }
                
            } catch (error) {
                console.error('Error:', error);
                addMessageToChat('bot', `Error: ${error.message}`);
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }

        function clearChat() {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML = '';
            addMessageToChat('bot', 'Hello! I can suggest hobbies based on your interests. What are you interested in?');
        }

        function login() {
            window.location.href = "/login";  // Note the leading slash
        }

        function signup() {
            window.location.href = "/signup";  // Note the leading slash
        }
                
        // Allow pressing Enter key to submit
        document.getElementById('interestInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                getRecommendations();
            }
        });
    </script>
</body>
</html>
